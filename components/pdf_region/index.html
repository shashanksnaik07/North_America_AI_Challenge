<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
body{margin:0;font:13px system-ui;color:#526578}#viewport{overflow:auto;background:#e3e8ef;border:1px solid #ccd6e2;border-radius:10px;padding:16px;box-sizing:border-box}canvas{display:block;width:100%;height:auto;cursor:crosshair;box-shadow:0 2px 8px #172b401f;touch-action:none;background:white}p{margin:6px 0}button{padding:6px 12px;background:#fff;border:1px solid #94a3b8;border-radius:5px}
</style></head><body><div id="viewport"><canvas id="page" aria-label="Original IEP PDF preview. Editable fields are also available in the Field selector."></canvas></div><p id="status" role="status"></p><script>
const canvas=document.getElementById('page'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),viewport=document.getElementById('viewport');
let args={},image=new Image(),start=null,selection=null;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function point(e){const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)*canvas.width/b.width,(e.clientY-b.top)*canvas.height/b.height]}
function paint(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0);for(const f of args.fields||[]){if(!args.show_fields&&f.path!==args.active_field)continue;let [x,y,r,b]=f.rect;ctx.strokeStyle=f.path===args.active_field?'#2563eb':'#3b82f677';ctx.lineWidth=f.path===args.active_field?3:1;ctx.strokeRect(x/args.width*canvas.width,y/args.height*canvas.height,(r-x)/args.width*canvas.width,(b-y)/args.height*canvas.height)}if(selection){ctx.fillStyle='#16a34a22';ctx.strokeStyle='#15803d';ctx.lineWidth=3;ctx.fillRect(...selection);ctx.strokeRect(...selection)}}
canvas.addEventListener('pointerdown',e=>{if(args.mode==='read')return;canvas.setPointerCapture(e.pointerId);start=point(e)});
canvas.addEventListener('pointermove',e=>{if(!start)return;let p=point(e);selection=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.abs(start[0]-p[0]),Math.abs(start[1]-p[1])];paint()});
canvas.addEventListener('pointerup',e=>{if(!start)return;let p=point(e),distance=Math.hypot(p[0]-start[0],p[1]-start[1]);start=null;if(args.mode==='select'||distance<5){let x=p[0]/canvas.width*args.width,y=p[1]/canvas.height*args.height;let match=(args.fields||[]).filter(f=>x>=f.rect[0]&&x<=f.rect[2]&&y>=f.rect[1]&&y<=f.rect[3]).sort((a,b)=>(a.rect[2]-a.rect[0])*(a.rect[3]-a.rect[1])-(b.rect[2]-b.rect[0])*(b.rect[3]-b.rect[1]))[0];if(match){send('streamlit:setComponentValue',{value:{field:match.path,page:args.page,event:Date.now()},dataType:'json'});status.textContent='Selected '+match.path}selection=null;paint();return}if(!selection||selection[2]<5||selection[3]<5)return;let [x,y,w,h]=selection;let rect=[x/canvas.width*args.width,y/canvas.height*args.height,(x+w)/canvas.width*args.width,(y+h)/canvas.height*args.height];status.textContent='Selected area: '+rect.map(v=>v.toFixed(1)).join(', ');send('streamlit:setComponentValue',{value:{rect,page:args.page,event:Date.now()},dataType:'json'});height()});
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;image.onload=()=>{canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.style.width=(args.zoom||100)+'%';viewport.style.height=(args.viewport_height||680)+'px';canvas.style.cursor=args.mode==='read'?'default':'crosshair';selection=null;if(args.selection){let [x,y,r,b]=args.selection;selection=[x/args.width*canvas.width,y/args.height*canvas.height,(r-x)/args.width*canvas.width,(b-y)/args.height*canvas.height]}status.textContent=args.mode==='read'?'Read-only preview':args.mode==='select'?'Click a highlighted field to open its editor.':'Drag a region, then save its field binding in the Edit panel.';paint();height()};image.src='data:image/png;base64,'+args.image});
window.addEventListener('resize',height);send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
